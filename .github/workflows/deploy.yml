name: CI/CD - Test & Deploy Backend to Hostinger

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-and-build:
    name: Run Tests & Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- BACKEND CI ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm test -- --watchAll=false

      - name: Run Backend E2E Tests
        working-directory: ./backend
        run: npm run test:e2e

      - name: Build NestJS Production Bundle
        working-directory: ./backend
        run: npm run build

      # --- FRONTEND CI CHECK (Vercel handles actual deployment) ---
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.HOSTINGER_BACKEND_URL }}
        run: npm run build

      - name: Upload Backend Build Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-build
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
          retention-days: 1

  deploy-backend-to-hostinger:
    name: Deploy NestJS Backend to Hostinger
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-production-build

      - name: Configure SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H ${{ secrets.HOSTINGER_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync NestJS Backend to Hostinger
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.htaccess' \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude 'node_modules/' \
            --exclude 'bin/' \
            --exclude 'cookies/' \
            --exclude 'temp/' \
            --exclude 'tmp/' \
            ./backend/ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_BACKEND_PATH }}/

      - name: Install Linux Dependencies & Restart Node App
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} << 'EOF'
            set -e
            export PATH=$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/opt/alt/alt-nodejs20/root/usr/bin:$PATH
            cd ${{ secrets.HOSTINGER_BACKEND_PATH }}
            npm ci --omit=dev --no-audit --no-fund
            mkdir -p tmp bin cookies temp
            touch tmp/restart.txt
            echo "NestJS backend updated and restart signal sent."
          EOF

      - name: Post-Deploy Smoke Test (/api/health)
        env:
          HEALTH_URL: ${{ secrets.HOSTINGER_BACKEND_URL }}/api/health
        run: |
          echo "Triggering Passenger lazy-boot and polling $HEALTH_URL..."
          MAX_RETRIES=6
          SLEEP_SECONDS=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            RESPONSE=$(curl -sS -w "\n%{http_code}" --max-time 15 "$HEALTH_URL" || true)
            HTTP_BODY=$(echo "$RESPONSE" | head -n 1)
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

            echo "HTTP Status: $HTTP_STATUS | Body: $HTTP_BODY"

            if [ "$HTTP_STATUS" = "200" ] && echo "$HTTP_BODY" | grep -q '"status":"ok"'; then
              echo "Smoke test passed: NestJS API and media binaries are healthy!"
              exit 0
            fi

            sleep $SLEEP_SECONDS
          done

          echo "Smoke test failed: API did not report healthy status after $MAX_RETRIES attempts."
          exit 1